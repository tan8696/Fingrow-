services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fingrow-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80,http://localhost
      - SESSION_DB_PATH=/app/data/sessions.db
      - LOANS_DB_PATH=/app/data/loans.db
    env_file:
      - path: ./backend/.env
        required: false
    volumes:
      - backend-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fingrow-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  backend-data:
    name: fingrow_backend_data
